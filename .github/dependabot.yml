# 依赖与动作的更新提醒（2026-09-22 加）
#
# 为什么需要：本项目的攻击面几乎全在别人写的代码上 —— 运行时只有一个依赖（PyYAML），
# CI 里用几个官方 action，另外还装 pytest/ruff。这些东西出 CVE 时，没有人会来通知我们，
# 唯一能保证"知道"的机制就是让机器每周自己看一眼。没有这个文件 = 依赖安全靠运气。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # 合并成一个 PR：这个仓库的依赖很少，分成十几个 PR 只会让 review 变成走过场
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
