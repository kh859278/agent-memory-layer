name: ci

on:
  push:
    branches: [main]
  pull_request:

# 显式声明最小权限（2026-09-22 加）：不要靠平台默认值 ——
# 这个 workflow 只读代码、跑测试，绝不需要写权限；默认值哪天变了不该把仓库一起带走。
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是最低支持版本，必须跑：3.10+ 才有的 API（例如 Path.write_text(newline=)）
        # 在本地 3.12 上永远看不出来，只有这里会红。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" zstandard
      - name: Lint (ruff)
        run: ruff check src tests tools
      - name: Tests (pytest)
        # 显式用 bash：Windows runner 默认是 PowerShell，管道的退出码语义不同，
        # 会导致"测试挂了但步骤判成功"或反之（同一个 workflow 三系统行为必须一致）
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Publish failure details
        # GitHub Actions 的日志要鉴权才能读；annotation 是免 token 可读的，
        # 而 CI 的 3.9/Windows 失败在本地很难复现——所以把失败尾巴转成 annotation。
        if: failure()
        shell: bash
        run: |
          if [ -f pytest.log ]; then
            tail -n 40 pytest.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::没有 pytest.log —— 失败发生在 Install/Lint 步骤，不是测试本身"
          fi

  scrub:
    # 内容泄漏扫描：这个仓库从一台在用的机器上抽取，绝不能让本机路径/客户名/密钥进仓库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Content leak scan
        run: python tools/scrub_check.py

  py39-compat:
    # 静态兜底：拿 3.9 编译一遍源码，抓"本地 3.12 看不出来"的语法/API 误用
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Compile all sources under 3.9
        run: python -m compileall -q src tools
