[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-layer"
version = "0.1.0"
description = "Cross-agent memory layer for coding agents: capture, distil, staged retrieval, human-readable mirror."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agent-memory-layer authors" }]
keywords = ["ai-agents", "memory", "mcp", "claude-code", "knowledge-base", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/kh859278/agent-memory-layer"
Repository = "https://github.com/kh859278/agent-memory-layer"
Issues = "https://github.com/kh859278/agent-memory-layer/issues"

[project.scripts]
aml = "aml.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aml = ["templates/*.yaml", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
# 基准 fixture 是**故意写坏的练习项目**（任务就是让 agent 把它修好）：
# 不能被仓库的 lint 规则"顺手修漂亮"，否则任务本身就不存在了。
extend-exclude = ["tools/bench/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
